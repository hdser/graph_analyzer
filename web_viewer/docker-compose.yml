version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-circles}
      - DB_USER=${DB_USER:-readonly_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - LAYOUT_SERVICE_URL=http://layout:3000/layout
    volumes:
      - ./cache:/app/cache
      - ../sql:/app/../sql:ro
    depends_on:
      - layout

  layout:
    build: ./layout_service
    ports:
      - "3000:3000"